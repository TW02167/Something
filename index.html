<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong Grand Auto 852</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }

        /* --- LOADING SCREEN --- */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0b0b; z-index: 1000; display: flex; flex-direction: column;
            justify-content: space-between; padding: 40px;
            transition: opacity 1s ease;
        }
        .loading-art-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; height: 60%;
        }
        .art-tile {
            background: linear-gradient(135deg, #ff0055, #7700ff);
            border-radius: 8px; opacity: 0.8; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.1);
        }
        .loading-footer {
            display: flex; flex-direction: column; gap: 15px;
        }
        .loading-title { font-size: 28px; letter-spacing: 2px; font-weight: 900; color: #ffcc00; }
        .loading-bar-container {
            width: 100%; height: 6px; background: #222; border-radius: 3px; overflow: hidden;
        }
        .loading-bar { width: 0%; height: 100%; background: #ffcc00; transition: width 0.2s linear; }

        /* --- MAIN MENU --- */
        #main-menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1508873696983-2df5c92064c7?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            z-index: 900; display: none; flex-direction: column; justify-content: flex-end; padding: 60px;
        }
        .menu-title { font-size: 64px; font-weight: 900; color: #fff; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); margin-bottom: 20px; line-height: 1; }
        .menu-title span { color: #ffcc00; }
        .menu-options { display: flex; flex-direction: column; gap: 12px; width: 300px; }
        .menu-btn {
            background: rgba(0, 0, 0, 0.6); border: 2px solid #fff; color: #fff; padding: 14px 20px;
            font-size: 18px; font-weight: bold; text-align: left; cursor: pointer; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .menu-btn:hover { background: #ffcc00; color: #000; border-color: #ffcc00; padding-left: 28px; }

        /* --- HUD & GAMEPLAY --- */
        #game-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: none; }
        #hud {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            display: flex; justify-content: space-between; padding: 25px; z-index: 10;
        }
        .hud-top-right { display: flex; gap: 20px; align-items: flex-start; }
        .money { font-size: 28px; font-weight: 900; color: #4CAF50; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); }
        .minimap-frame {
            width: 180px; height: 180px; background: rgba(0,20,40,0.8); border: 3px solid #fff;
            border-radius: 50%; overflow: hidden; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .minimap-player {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background: #00ffff; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%);
        }

        /* --- PAUSE / MAP MENU --- */
        #pause-menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.95); z-index: 800; display: none;
            flex-direction: column; padding: 40px;
        }
        .pause-header { font-size: 36px; font-weight: 900; border-bottom: 3px solid #ffcc00; padding-bottom: 10px; margin-bottom: 30px; }
        .pause-content { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; height: 100%; }
        .big-map {
            background: #111; border: 2px solid #444; border-radius: 10px; position: relative; overflow: hidden;
            background-image: radial-gradient(#222 1px, transparent 1px); background-size: 20px 20px;
        }
        .map-district {
            position: absolute; border: 1px dashed rgba(255,255,255,0.2); padding: 10px; font-size: 14px; color: rgba(255,255,255,0.4);
        }
        .pause-sidebar { display: flex; flex-direction: column; gap: 15px; }
        .pause-btn {
            background: #222; border: none; color: #fff; padding: 15px; font-size: 16px; font-weight: bold;
            text-align: left; cursor: pointer; border-left: 5px solid #ffcc00; transition: 0.2s;
        }
        .pause-btn:hover { background: #333; padding-left: 20px; }

        /* Controls Tip */
        .controls-tip {
            position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 12px 18px;
            border-radius: 6px; font-size: 14px; pointer-events: none; z-index: 10; border-left: 4px solid #ffcc00;
        }
    </style>
    <!-- Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 1. LOADING SCREEN -->
    <div id="loading-screen">
        <div class="loading-art-grid">
            <div class="art-tile" style="background: linear-gradient(135deg, #ff416c, #ff4b2b);">TAXI 852</div>
            <div class="art-tile" style="background: linear-gradient(135deg, #834d9b, #d04ed6);">NEON</div>
            <div class="art-tile" style="background: linear-gradient(135deg, #00b4db, #0083b0);">PEAK</div>
            <div class="art-tile" style="background: linear-gradient(135deg, #f12711, #f5af19);">MK NIGHTS</div>
        </div>
        <div class="loading-footer">
            <div class="loading-title">HONG KONG GRAND AUTO 852</div>
            <div class="loading-bar-container">
                <div class="loading-bar" id="load-bar"></div>
            </div>
        </div>
    </div>

    <!-- 2. MAIN MENU -->
    <div id="main-menu">
        <div class="menu-title">HONG KONG<br><span>狂飆 852</span></div>
        <div class="menu-options">
            <button class="menu-btn" onclick="startGame()">Story Mode</button>
            <button class="menu-btn" onclick="openMapMenu()">Map & Settings</button>
            <button class="menu-btn" onclick="alert('Version 1.0.0 - Built for HKUGA!')">Credits</button>
        </div>
    </div>

    <!-- 3. GAMEPLAY & HUD -->
    <div id="game-container"></div>
    <div id="hud" style="display:none;">
        <div class="money">$852,000</div>
        <div class="hud-top-right">
            <div class="minimap-frame">
                <div class="minimap-player"></div>
            </div>
        </div>
    </div>
    <div class="controls-tip" id="tip" style="display:none;">[WASD] Drive/Walk | [ESC] Pause Menu & Map</div>

    <!-- 4. PAUSE & FULL MAP MENU -->
    <div id="pause-menu">
        <div class="pause-header">PAUSED / MAP OF HONG KONG</div>
        <div class="pause-content">
            <div class="big-map">
                <div class="map-district" style="top: 20px; left: 20px;">[ Mong Kok Neon District ]</div>
                <div class="map-district" style="top: 50px; right: 30px;">[ Victoria Harbour Waterfront ]</div>
                <div class="map-district" style="bottom: 30px; left: 40px;">[ Peak Mountain Roads ]</div>
            </div>
            <div class="pause-sidebar">
                <button class="pause-btn" onclick="resumeGame()">Resume Game</button>
                <button class="pause-btn" onclick="location.reload()">Main Menu</button>
            </div>
        </div>
    </div>

    <script>
        // --- LOADING SCREEN SIMULATION ---
        let loadProgress = 0;
        const loadBar = document.getElementById('load-bar');
        const loadingScreen = document.getElementById('loading-screen');
        const mainMenu = document.getElementById('main-menu');

        const loadInterval = setInterval(() => {
            loadProgress += Math.floor(Math.random() * 15) + 5;
            if (loadProgress >= 100) {
                loadProgress = 100;
                clearInterval(loadInterval);
                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        mainMenu.style.display = 'flex';
                    }, 1000);
                }, 500);
            }
            loadBar.style.width = loadProgress + '%';
        }, 150);

        // --- GAME INIT ---
        let gameStarted = false;
        let scene, camera, renderer, playerCar;

        function startGame() {
            mainMenu.style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('tip').style.display = 'block';
            gameStarted = true;

            initThreeJS();
        }

        function initThreeJS() {
            const container = document.getElementById('game-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Lights (Neon vibe)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xff0055, 1);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // Ground Grid (Streets)
            const gridHelper = new THREE.GridHelper(500, 50, 0xffcc00, 0x222244);
            gridHelper.position.y = -0.1;
            scene.add(gridHelper);

            // Generate Map Buildings (District Blocks)
            const buildingGeo = new THREE.BoxGeometry(8, 30, 8);
            for (let i = -10; i <= 10; i++) {
                for (let j = -10; j <= 10; j++) {
                    if (Math.abs(i) % 2 === 0 && Math.abs(j) % 2 === 0) continue; // leave roads
                    const height = 15 + Math.random() * 40;
                    const mat = new THREE.MeshLambertMaterial({ 
                        color: Math.random() > 0.5 ? 0x111122 : 0x1a1a3a 
                    });
                    const bldg = new THREE.Mesh(new THREE.BoxGeometry(7, height, 7), mat);
                    bldg.position.set(i * 15, height / 2, j * 15);
                    scene.add(bldg);
                }
            }

            // Player Red Taxi (JDM / HK Style)
            const carGeo = new THREE.BoxGeometry(2, 1, 4);
            const carMat = new THREE.MeshLambertMaterial({ color: 0xcc0000 }); // Classic HK Red Taxi color
            playerCar = new THREE.Mesh(carGeo, carMat);
            playerCar.position.set(0, 0.5, 0);
            scene.add(playerCar);

            // Camera follow position
            camera.position.set(0, 6, -10);
            camera.lookAt(playerCar.position);

            animate();
        }

        // Car Controls & Movement
        let keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'Escape' && gameStarted) {
                togglePause();
            }
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted && playerCar) {
                if (keys['w']) playerCar.translateZ(0.3);
                if (keys['s']) playerCar.translateZ(-0.2);
                if (keys['a']) playerCar.rotation.y += 0.04;
                if (keys['d']) playerCar.rotation.y -= 0.04;

                // Smooth Camera Follow
                const targetX = playerCar.position.x - Math.sin(playerCar.rotation.y) * 8;
                const targetZ = playerCar.position.z - Math.cos(playerCar.rotation.y) * 8;
                camera.position.x += (targetX - camera.position.x) * 0.1;
                camera.position.z += (targetZ - camera.position.z) * 0.1;
                camera.position.y = playerCar.position.y + 4;
                camera.lookAt(playerCar.position.x, playerCar.position.y + 1, playerCar.position.z);
            }

            renderer.render(scene, camera);
        }

        // --- PAUSE & MAP MENU TOGGLES ---
        let isPaused = false;
        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pause-menu').style.display = isPaused ? 'flex' : 'none';
        }
        function openMapMenu() {
            document.getElementById('pause-menu').style.display = 'flex';
        }
        function resumeGame() {
            isPaused = false;
            document.getElementById('pause-menu').style.display = 'none';
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
